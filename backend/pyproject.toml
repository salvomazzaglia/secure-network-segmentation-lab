[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-network-segmentation-lab"
version = "1.0.0"
description = "Vendor-neutral offline-first Secure Network Segmentation Lab (synthetic)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Salvatore Mazzaglia" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "build>=1.2.0",
]

[project.scripts]
snsl = "secure_network_segmentation_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_network_segmentation_lab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["UP042", "N801", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017", "N802"]
"../scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["secure_network_segmentation_lab"]
# Sequence covariance and Pydantic dynamics are intentionally pragmatic in v1.0
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
